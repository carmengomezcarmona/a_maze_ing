[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
description = "Reusable maze generation engine: perfect and Pac-Man-style mazes, wall-coherent grid, '42' pattern, BFS solver."
readme = "mazegen/README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
authors = [
    { name = "carmgome" },
    { name = "gapostig" },
]
keywords = ["maze", "generator", "recursive-backtracker", "42", "pacman"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# [project.urls]
# Repository = "https://github.com/REPLACE-ME/a-maze-ing"

# Only the `mazegen` package is shipped: `app`, `display`, `tests` and
# `a_maze_ing.py` are the A-Maze-ing *application*, not the reusable
# engine, and must not end up bundled inside mazegen-*.whl.
[tool.setuptools.packages.find]
include = ["mazegen*"]

[tool.setuptools.package-data]
mazegen = ["py.typed"]
